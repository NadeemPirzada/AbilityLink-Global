<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | AbilityLink Global</title>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="navbar glass">
  <div class="logo">
    <span>AbilityLink</span> Global
  </div>
</header>

<section class="stories">

  <div class="section-title">
    <h2>Contact Us</h2>
    <p>
      Reach out for support, mentorship, or partnerships.
    </p>
  </div>

  <form class="glass" style="padding:40px; max-width:700px; margin:auto; border-radius:20px;">

    <input type="text"
           placeholder="Your Name"
           style="width:100%; padding:15px; margin-bottom:20px; border-radius:10px; border:none;">

    <input type="email"
           placeholder="Your Email"
           style="width:100%; padding:15px; margin-bottom:20px; border-radius:10px; border:none;">

    <textarea placeholder="Your Message"
              style="width:100%; height:180px; padding:15px; border-radius:10px; border:none;"></textarea>

    <button class="apply-btn"
            style="margin-top:20px; border:none; cursor:pointer;">
      Send Message
    </button>

  </form>

</section>

</body>
</html>
